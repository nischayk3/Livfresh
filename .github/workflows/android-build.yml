name: EAS Android Build
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Override Android versionCode (leave empty to use app.json)'
        required: false
        type: string

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 🔢 Verify & Configure Versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            echo "Overriding Android versionCode with: ${{ inputs.version_code }}"
            node -e "
              const fs = require('fs');
              const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              app.expo.android.versionCode = parseInt('${{ inputs.version_code }}', 10);
              fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            "
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: override versionCode to ${{ inputs.version_code }} for build [skip ci]" || true
          fi

          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "Building SpinZo Android:"
          echo "  - versionName: $VERSION_NAME"
          echo "  - versionCode: $VERSION_CODE"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: 🚀 Build Android (.aab)
        run: EAS_SKIP_AUTO_FINGERPRINT=1 eas build --platform android --profile production --local --non-interactive --output=app-release.aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"

      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-production-build
          path: app-release.aab
          if-no-files-found: warn

      - name: 📊 Job Summary
        if: always()
        run: |
          echo "### 🚀 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **App Version:** \`${{ env.VERSION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** \`${{ env.VERSION_CODE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`app-release.aab\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
